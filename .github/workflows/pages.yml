# GitHub Pages sert la racine de la branche main (Settings → Pages → Deploy from a branch).
# Ce workflow reconstruit la version téléphone quand le frontend change et met à jour
# les fichiers servis à la racine (index.html, sw.js, manifest, icônes).
name: Reconstruire l'app téléphone

on:
  push:
    branches: [main]
    paths: ['frontend/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build:mobile
        working-directory: frontend
      - name: Copier le build à la racine
        run: |
          cp frontend/dist-mobile/{index.html,manifest.webmanifest,sw.js,icon-192.png,icon-512.png,favicon.svg} .
          touch .nojekyll
      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest sw.js icon-192.png icon-512.png favicon.svg .nojekyll
          git diff --cached --quiet || (git commit -m "Build app téléphone [skip ci]" && git push)
